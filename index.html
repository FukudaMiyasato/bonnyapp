<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- Contenido a pantalla completa bajo la barra de estado (zona de la cámara) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bonny" />
  <title>Bonny</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preload" href="assets/fonts/Bungee-Regular.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="baul.css" />
</head>
<body>
  <main class="onboarding" data-step="0">
    <section class="stage" aria-hidden="true">
      <!-- Videos fuente: se dibujan en las mitades de abajo, así ambas mitades quedan sincronizadas -->
      <video class="src" src="assets/videos/01loop.mp4" autoplay muted loop playsinline preload="auto"></video>
      <video class="src" src="assets/videos/02loop.mp4" autoplay muted loop playsinline preload="auto"></video>

      <div class="half half--left"><canvas></canvas><span class="shade"></span></div>
      <div class="half half--right"><canvas></canvas><span class="shade"></span></div>

      <div class="leaf">
        <div class="face face--front"><canvas></canvas><span class="shade"></span></div>
        <div class="face face--back"><canvas></canvas><span class="shade"></span></div>
      </div>
    </section>

    <section class="ui">
      <div class="card">
        <div class="copy">
          <article class="copy__item" data-index="0">
            <h1>Crea recuerdos</h1>
            <p>Toma fotos, graba audios y videos. Guarda <mark>cualquier</mark> momento importante.</p>
          </article>
          <article class="copy__item" data-index="1">
            <h1>Revive cada momento</h1>
            <p>No importa lo que guardaste, acá podrás revivirlo.</p>
          </article>
        </div>
      </div>

      <div class="dots" role="tablist" aria-label="Pasos">
        <button class="dot" role="tab" aria-label="Paso 1" data-go="0"></button>
        <button class="dot" role="tab" aria-label="Paso 2" data-go="1"></button>
      </div>

      <div class="actions">
        <button class="btn btn-start" type="button" tabindex="-1">Empezar</button>
      </div>
    </section>
  </main>

  <!-- Escena 2: primer baúl (foto familiar) -->
  <section class="baul" hidden aria-label="Primer baúl">
    <div class="baul__bg"></div>
    <div class="baul__ui">
      <div class="bubble">
        <h2 class="bubble__text">Todo baúl de<br />recuerdos inicia con<br />una foto familiar</h2>
      </div>

      <div class="cam">
        <div class="cam__window">
          <video class="cam__video" autoplay muted playsinline></video>
          <canvas class="cam__shot"></canvas>
          <span class="cam__scan"></span>
          <span class="cam__status">revelando<i>.</i><i>.</i><i>.</i></span>
          <span class="cam__msg"></span>
        </div>
        <img class="cam__frame" src="assets/img/photo-frame.webp" alt="" draggable="false" />
        <button class="cam__shutter" type="button" aria-label="Tomar foto">
          <img src="assets/img/btn-shutter.png" alt="" draggable="false" />
        </button>
        <button class="cam__switch" type="button" aria-label="Cambiar cámara">
          <img src="assets/img/btn-switch.png" alt="" draggable="false" />
        </button>
        <input class="cam__file" type="file" accept="image/*" hidden />
      </div>

      <div class="members">
        <span class="members__label">integrantes</span>
        <div class="members__row"></div>
      </div>

      <div class="baul__actions">
        <button class="btn btn-continue" type="button" disabled>continuar</button>
        <button class="link-skip" type="button">saltar</button>
      </div>
    </div>
  </section>

  <span class="flash" aria-hidden="true"></span>

  <!-- Filtro de nostalgia: luces que se filtran, acabado mate, grano y viñeta -->
  <span class="fx fx__leak fx__leak--a" aria-hidden="true"></span>
  <span class="fx fx__leak fx__leak--b" aria-hidden="true"></span>
  <span class="fx fx__leak fx__leak--c" aria-hidden="true"></span>
  <span class="fx fx__matte" aria-hidden="true"></span>
  <span class="fx fx__tint" aria-hidden="true"></span>
  <span class="fx fx__grain" aria-hidden="true"></span>
  <span class="fx fx__vignette" aria-hidden="true"></span>

  <!-- Botón de música: visible en toda la app -->
  <button class="music" type="button" aria-label="Pausar música" aria-pressed="true">
    <img src="assets/img/sound.png" alt="" draggable="false" />
  </button>

  <script src="data.js"></script>
  <script src="audio.js"></script>
  <script src="app.js"></script>
  <script src="baul.js"></script>
</body>
</html>
