<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- Contenido a pantalla completa bajo la barra de estado (zona de la cámara) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bonny" />
  <title>Bonny</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preload" href="assets/fonts/Bungee-Regular.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="onboarding" data-step="0">
    <section class="stage" aria-hidden="true">
      <!-- Videos fuente: se dibujan en las mitades de abajo, así ambas mitades quedan sincronizadas -->
      <video class="src" src="assets/videos/01loop.mp4" autoplay muted loop playsinline preload="auto"></video>
      <video class="src" src="assets/videos/02loop.mp4" autoplay muted loop playsinline preload="auto"></video>

      <div class="half half--left"><canvas></canvas><span class="shade"></span></div>
      <div class="half half--right"><canvas></canvas><span class="shade"></span></div>

      <div class="leaf">
        <div class="face face--front"><canvas></canvas><span class="shade"></span></div>
        <div class="face face--back"><canvas></canvas><span class="shade"></span></div>
      </div>
    </section>

    <section class="ui">
      <div class="card">
        <div class="copy">
          <article class="copy__item" data-index="0">
            <h1>Crea recuerdos</h1>
            <p>Toma fotos, graba audios y videos. Guarda <mark>cualquier</mark> momento importante.</p>
          </article>
          <article class="copy__item" data-index="1">
            <h1>Revive cada momento</h1>
            <p>No importa lo que guardaste, acá podrás revivirlo.</p>
          </article>
        </div>
      </div>

      <div class="dots" role="tablist" aria-label="Pasos">
        <button class="dot" role="tab" aria-label="Paso 1" data-go="0"></button>
        <button class="dot" role="tab" aria-label="Paso 2" data-go="1"></button>
      </div>

      <div class="actions">
        <button class="btn-start" type="button" tabindex="-1">Empezar</button>
      </div>
    </section>
  </main>

  <!-- Filtro de nostalgia: luces que se filtran, acabado mate, grano y viñeta -->
  <span class="fx fx__leak fx__leak--a" aria-hidden="true"></span>
  <span class="fx fx__leak fx__leak--b" aria-hidden="true"></span>
  <span class="fx fx__leak fx__leak--c" aria-hidden="true"></span>
  <span class="fx fx__matte" aria-hidden="true"></span>
  <span class="fx fx__tint" aria-hidden="true"></span>
  <span class="fx fx__grain" aria-hidden="true"></span>
  <span class="fx fx__vignette" aria-hidden="true"></span>

  <!-- Botón de música: visible en toda la app -->
  <button class="music" type="button" aria-label="Pausar música" aria-pressed="true">
    <img src="assets/img/sound.png" alt="" draggable="false" />
  </button>

  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
